name: Publish Docker image to GHCR

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image for validation
        run: docker build --tag twitch-channel-points-miner:validation .

      - name: Compile project and test run template in Docker
        run: |
          docker run --rm \
            --mount "type=bind,source=${GITHUB_WORKSPACE}/run.template.py,target=/usr/src/app/run.template.py,readonly" \
            --mount "type=bind,source=${GITHUB_WORKSPACE}/tests,target=/tmp/tests,readonly" \
            --entrypoint python \
            twitch-channel-points-miner:validation \
            -m compileall -q /usr/src/app/TwitchChannelPointsMiner
          docker run --rm \
            --mount "type=bind,source=${GITHUB_WORKSPACE}/run.template.py,target=/usr/src/app/run.template.py,readonly" \
            --mount "type=bind,source=${GITHUB_WORKSPACE}/tests,target=/tmp/tests,readonly" \
            --entrypoint python \
            twitch-channel-points-miner:validation \
            -m unittest discover -s /tmp/tests -v

  publish:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/swissluckyfox/twitch-channel-points-miner-v2
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and publish linux/amd64 image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report image digest
        run: echo "${{ steps.build.outputs.digest }}"

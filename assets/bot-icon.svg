  <polygon points="465,395 395,455 400,420" fill="#5b25b8"/>
  <polygon points="285,330 330,315 300,445 295,445" fill="#8a4dff"/>
  <rect x="340" y="322" width="96" height="28" rx="4" fill="#ffffff"/>
  <rect x="374" y="348" width="28" height="80" rx="4" fill="#ffffff"/>

  <!-- Sparkles where the pickaxe hits -->
  <g fill="#ffd84a">
    <path d="M440 238 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6z"/>
    <path d="M392 246 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z"/>
    <path d="M470 280 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z"/>

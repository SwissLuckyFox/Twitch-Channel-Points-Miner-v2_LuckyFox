  <line x1="185" y1="355" x2="232" y2="342" stroke="#e07a1a" stroke-width="24" stroke-linecap="round"/>

  <!-- Pickaxe -->
  <line x1="225" y1="350" x2="370" y2="176" stroke="#8b5a2b" stroke-width="14" stroke-linecap="round"/>
  <path d="M298 132 Q 375 160 420 240" fill="none" stroke="#4a5560" stroke-width="26" stroke-linecap="round"/>
  <path d="M298 132 Q 375 160 420 240" fill="none" stroke="#c9d1d9" stroke-width="16" stroke-linecap="round"/>

  <!-- Paws over the handle -->

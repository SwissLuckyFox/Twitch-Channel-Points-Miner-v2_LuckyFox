  <circle cx="232" cy="342" r="15" fill="#7a3a12"/>

  <!-- Fox head -->
  <polygon points="130,205 140,135 182,192" fill="#f28c28"/>
  <polygon points="141,192 146,156 168,190" fill="#5a2a10"/>
  <polygon points="172,192 205,135 222,205" fill="#f28c28"/>
  <polygon points="184,192 203,153 211,196" fill="#5a2a10"/>
  <ellipse cx="175" cy="235" rx="62" ry="52" fill="#f28c28"/>
  <polygon points="212,222 276,252 212,278" fill="#f28c28"/>
  <polygon points="178,256 276,254 218,288 172,282" fill="#fff1dc"/>
  <polygon points="115,245 150,272 122,284" fill="#fff1dc"/>
